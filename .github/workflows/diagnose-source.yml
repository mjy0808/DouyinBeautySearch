name: Diagnose Douyin source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnose-source.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-diagnostics
          path: data/diagnostics/
          retention-days: 7
