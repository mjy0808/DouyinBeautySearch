name: Publish saved report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/publish-page.yml']

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: beauty-page-publish
  cancel-in-progress: false

jobs:
  publish:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Find latest collected report
        id: report
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'daily-beauty.yml', branch: 'main',
              status: 'success', per_page: 10
            });
            for (const run of data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: run.id });
              const name = `beauty-site-${run.id}`;
              if (artifacts.data.artifacts.some(a => a.name === name && !a.expired)) {
                core.setOutput('run_id', String(run.id));
                core.setOutput('artifact', name);
                break;
              }
            }
      - name: Restore latest collected report
        if: steps.report.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.report.outputs.artifact }}
          run-id: ${{ steps.report.outputs.run_id }}
          github-token: ${{ github.token }}
          path: restored-site
      - name: Keep report data with current page design
        if: steps.report.outputs.run_id != ''
        run: |
          for directory in data archive assets; do
            if [ -d "restored-site/$directory" ]; then
              cp -R "restored-site/$directory/." "site/$directory/"
            fi
          done
      - name: Build automatic daily list from saved data
        run: |
          if [ ! -f site/data/latest.json ]; then node src/cli.mjs --seed; fi
          node scripts/migrate-reports.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy saved report
        id: deployment
        uses: actions/deploy-pages@v4
